<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card</title>
    <link rel="icon" type="image/x-icon" href="images\creditcardicon.png">
    <link href="styles.css" rel="stylesheet">
    <script defer src="variables.js"></script>
</head>
<body>
    <div id="creditcard">
        
        <div id="top">
            <p id="total">TOTAL: $199</p>
            <p id="icon"> 💳 </p>
            <div id="cardNumber">
                <label for="cardNumber">CARD NUMBER</label>
                <input type='text' id='number' name="cardNumber" placeholder="1234 5678 9101 1020" aria-labelledby="cardNumber">
            </div>  
            <div id="cardHolder">
                <label for="cardHolder">CARD HOLDER</label>
                <input type='text' id='name' name="cardHolder" placeholder="John Doe" aria-labelledby="cardHolder" required>
            </div>  
            <div id="cardExpiration">
                <label for="expirationDate" id="exp">EXPIRATION</label>
                <input type='number' id='month' name="expMonth" placeholder="MM" aria-labelledby="expirationDate">
                <input type='number' id='year' name="expYear" placeholder="YY" aria-labelledby="expirationDate">
            </div>            
        </div> 
        <div id="bottom">
            <div id="CVCCVV">
                <label for="CVC/CVV" id="CVC">CVC/CVV</label>
                <input type='number' id='CVV' name="CVC/CVV" placeholder="xxx" aria-labelledby="CVC/CVV">
            </div>  

        </div>

        <button button id="submit"type="button" onclick="testIt()">Submit</button>
    </div>
</body>
</html>
